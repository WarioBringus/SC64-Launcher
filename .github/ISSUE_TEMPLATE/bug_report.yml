name: Bug report
description: Something in SC64 Launcher isn't working as it should
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! A few details make it much easier to track down.

        **Before reporting:**
        - Please don't ask for ROMs or links to them; those issues will be closed.
        - ROM hacks made only for PC emulators won't run on real hardware, so they're not launcher bugs.
        - Wrong game details (title, genre, year...)? You can fix them on your card with `menu/game-fixes.txt`
          (see the release's README.txt). Reporting them here is welcome too.

  - type: input
    id: build
    attributes:
      label: Launcher build number
      description: Start > Settings > System > Menu information.
      placeholder: "build 288"
    validations:
      required: true

  - type: dropdown
    id: console
    attributes:
      label: Console
      options:
        - Analogue 3D
        - Original N64 (with Expansion Pak)
        - Original N64 (without Expansion Pak)
        - Other
    validations:
      required: true

  - type: input
    id: console_firmware
    attributes:
      label: Console firmware (Analogue 3D)
      placeholder: "1.5.1, or N/A"

  - type: input
    id: sc64_firmware
    attributes:
      label: SummerCart64 firmware
      description: Start > Settings > System > Flashcart (the "Firmware" line).
      placeholder: "2.20.2"
    validations:
      required: true

  - type: dropdown
    id: screen
    attributes:
      label: Screen setting
      description: Start > Settings > Look > Screen.
      options:
        - "16:9"
        - "4:3"
        - Not sure

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. The screen (Home, Library...), the
        Home style or Library layout, the theme and the game help too.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Photos or screenshots
      description: A photo of the TV is perfect. Drag images in here.

  - type: textarea
    id: log
    attributes:
      label: Performance log (optional, for slowdowns or freezes)
      description: In menu/config.ini on the SD card, add the line "perf_log = true" under [launcher], repeat the
        problem, then attach menu/cache/launcher/perf-log.txt from the card.
