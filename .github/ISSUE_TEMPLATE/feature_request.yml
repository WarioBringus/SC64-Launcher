name: Idea or request
description: Suggest something for SC64 Launcher
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome! SC64 Launcher is a library launcher for the SummerCart64: it's about finding and starting
        your games. System settings and controller tools stay with the Analogue 3D's own menu.

  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like, and what would it help with?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Anything that shows it
      description: A sketch, a photo, or another menu that does something similar.
